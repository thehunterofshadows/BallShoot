services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ballshoot:dev}
    container_name: ${WEB_CONTAINER_NAME:-ballshoot-dev-web}
    networks:
      - edge
    restart: unless-stopped

  gameserver:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    image: ${GAME_SERVER_IMAGE:-ballshoot-gameserver:dev}
    container_name: ${GAME_SERVER_CONTAINER_NAME:-ballshoot-dev-gameserver}
    network_mode: "service:web"
    restart: unless-stopped
    environment:
      # Leaderboard table. Unset or unwritable falls back to in-memory only.
      SCORES_PATH: /data/scores.json
    volumes:
      - scores:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  test:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: test
    image: ${TEST_IMAGE:-ballshoot-test:dev}
    working_dir: /app
    volumes:
      - ./server:/app/server:ro
      - ./tests:/app/tests:ro
      - ./coop-bubbles.js:/app/coop-bubbles.js:ro
      - ./support.js:/app/support.js:ro
      - ./index.html:/app/index.html:ro
      - ./nginx.conf:/app/nginx.conf:ro
      - ./Dockerfile:/app/Dockerfile:ro
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        test -s /app/index.html
        test -s /app/coop-bubbles.js
        test -s /app/support.js
        grep -q 'coop-bubbles.js' /app/index.html
        node --check /app/coop-bubbles.js
        node --check /app/support.js
        node --check /app/server/game.js
        node --check /app/server/battle.js
        node --check /app/server/lobbies.js
        node --check /app/server/server.js
        node --check /app/server/scores.js
        npm test
    profiles:
      - test

  # Renders the game across the device shapes that broke the old fixed-aspect layout.
  # Run: docker compose run --rm --no-deps screens
  screens:
    build:
      context: .
      dockerfile: scripts/Dockerfile.screens
    image: ${SCREENS_IMAGE:-ballshoot-screens:dev}
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./coop-bubbles.js:/app/coop-bubbles.js:ro
      - ./support.js:/app/support.js:ro
      - ./index.html:/app/index.html:ro
      - ./screenshots:/app/screenshots
    # The game is served on loopback, but support.js boots by fetching React (and the
    # Fredoka webfont) from a CDN, so this one needs egress unlike the `test` service.
    # Joining the shared default bridge avoids allocating a per-project subnet.
    network_mode: bridge
    shm_size: 1gb
    profiles:
      - test

volumes:
  # Unnamed on purpose: Compose prefixes it with COMPOSE_PROJECT_NAME, so Dev and Prod
  # get separate leaderboards without any extra env plumbing.
  scores:

networks:
  edge:
    name: edge
    external: true
